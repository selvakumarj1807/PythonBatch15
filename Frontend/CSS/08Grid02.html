<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            border: 2px solid red;
            margin: 30px;
            padding: 10px;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(3, 1fr);
        }

        .box{
            border: 2px solid blue;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box1{
            grid-column: span 2;
        }

        .box3{
            grid-row: span 2;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box box1">
            <p>1</p>
        </div>

        <div class="box box2">
            <p>2</p>
        </div>

        <div class="box box3">
            <p>3</p>
        </div>

        <div class="box box4">
            <p>4</p>
        </div>

        <div class="box">
            <p>5</p>
        </div>

        <div class="box">
            <p>6</p>
        </div>

        <div class="box">
            <p>7</p>
        </div>

        <div class="box">
            <p>8</p>
        </div>

        <div class="box">
            <p>9</p>
        </div>
    </div>
</body>

</html>
