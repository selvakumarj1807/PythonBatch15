<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            color: blue;
            background-color: yellow;
            font-size: 24px;
        }

        #myId {
            color: red;
            background-color: lightgray;
            font-size: 30px;
        }

        .myClass {
            color: green;
            background-color: lightblue;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <h1>Tag Selector</h1>
    <h1 id="myId">ID Selector</h1>
    <h1 style="color: purple; background-color: lavender; font-size: 28px;">Inline CSS</h1>
    <h1 class="myClass">Class Selector</h1>
    <h1 class="myClass">Class Selector</h1>
    <h1 class="myClass">Class Selector</h1>
</body>

</html>
