<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <button onclick="addTwoNum()">Add Two Numbers</button>


    <script>
        function addTwoNum() {
            a = prompt("Enter a Value 01 : ");

            b = prompt("Enter a Value 02 : ");

            v1 = parseInt(a);
            v2 = parseInt(b);

            sum = v1 + v2;

            console.log("The Sum is : " + sum);

            console.log(v1 + " + " + v2 + " = " + sum);
        }
    </script>
</body>

</html>
