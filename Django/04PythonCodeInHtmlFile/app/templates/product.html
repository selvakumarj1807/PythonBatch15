<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>

    <!-- Internal CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f4f4;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
            text-align: center;
        }

        .card-content h2 {
            margin-bottom: 10px;
        }

        .price {
            color: green;
            font-size: 20px;
            margin-bottom: 10px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <h1>Product Cards</h1>

    <div class="container">

        <!-- Product 1 -->
        <div class="card">
            <img src="https://picsum.photos/id/180/300/200" alt="Laptop">

            <div class="card-content">
                <h2>Laptop</h2>
                <p class="price">₹55,000</p>
                <button onclick="buyProduct('Laptop')">
                    Buy Now
                </button>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="card">
            <img src="https://picsum.photos/id/160/300/200" alt="Mobile">

            <div class="card-content">
                <h2>Mobile</h2>
                <p class="price">₹25,000</p>
                <button onclick="buyProduct('Mobile')">
                    Buy Now
                </button>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="card">
            <img src="https://picsum.photos/id/250/300/200" alt="Headphone">

            <div class="card-content">
                <h2>Headphone</h2>
                <p class="price">₹3,000</p>
                <button onclick="buyProduct('Headphone')">
                    Buy Now
                </button>
            </div>
        </div>

    </div>

    <!-- Internal JavaScript -->
    <script>

        function buyProduct(productName) {
            alert(productName + " added to cart!");
        }

    </script>

</body>

</html>
